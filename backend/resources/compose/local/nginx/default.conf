server {
    listen 80;
    server_name localhost;

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    # Feedback uploads are served only by the authenticated download API.
    location ^~ /media/platform_feedback/ {
        return 404;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
    }
}
