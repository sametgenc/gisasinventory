api:
  dashboard: false

log:
  level: INFO

accessLog:
  format: json
  fields:
    defaultMode: drop
    names:
      StartUTC: keep
      ClientHost: keep
      RequestMethod: keep
      RequestProtocol: keep
      DownstreamStatus: keep
      Duration: keep
      RouterName: keep
      ServiceName: keep
    headers:
      defaultMode: drop

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    forwardedHeaders:
      insecure: false

providers:
  file:
    filename: /etc/traefik/conf/dynamic.yml
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${LETS_ENCRYPT_EMAIL}"
      storage: /etc/traefik/acme/acme.json
      httpChallenge:
        entryPoint: web
