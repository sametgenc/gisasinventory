<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gisas Platform — shipyard inventory, teams, and reporting in one place. Secure multi-tenant asset management for maritime operations." />
  <meta property="og:title" content="Gisas Platform" />
  <meta property="og:description" content="Shipyard inventory, teams, and reporting in one place. Multi-tenant asset management built for maritime operations." />

  <title>Gisas Platform</title>
</head>

<body>
  <script>
    (function () {
      try {
        const storageKey = "vite-ui-theme";
        const theme = localStorage.getItem(storageKey);
        const supportDarkMode = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolvedTheme =
          theme === "dark" || (theme === "system" && supportDarkMode) || (!theme && supportDarkMode)
            ? "dark"
            : "light";

        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(resolvedTheme);
        document.documentElement.style.backgroundColor = resolvedTheme === "dark" ? "#101923" : "#f5f7f9";
        document.documentElement.style.colorScheme = resolvedTheme;
      } catch (e) {
        console.error("Theme script failed", e);
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
